<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry Study Club</title>

    <!--Font code here-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!--Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!--Style-->
    <link rel="stylesheet" href="styles/style_geral.css">
    <link rel="stylesheet" href="styles/media_queries.css">
</head>

<body>
    <header>
        <h1>Cherry Study Club 🍒</h1>
        <p>My journey starts here.</p>
    </header>

    <main>
        <h2 class="main-h2">Meu cantinho de estudos</h2>
        <p class="main-p">Um pequeno passo de cada vez.</p>

        <!--Dashboard section-->
        <div class="dashboard">
            <!--Seção de Missão-->
            <section class="mission">
                <h2 class="h2-content">Today's Mission</h2>

                <div class="mission-content">
                    <p class="p-content">Practice JavaScript for 20 minutes.</p>
                    <button class="btn-section">Start Mission</button>
                </div>    
            </section>

            <!--Seção de Progresso-->
            <section class="progress">
                <h2 class="h2-content">My Progress</h2>

                <div class="progress-content">
                    <p class="p-content">Completed 5 missions this week!</p>
                    <button class="btn-section">View Progress</button>
                </div>
            </section>

            <!--Seção de Motivação-->
            <section class="motivation">
                <h2 class="h2-content">Motivation Corner</h2>

                <div class="motivation-content">
                    <p class="p-content">"The secret of getting ahead is getting started." - Mark Twain</p>
                    <button class="btn-section">Get Inspired</button>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
